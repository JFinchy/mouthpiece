[package]
name = "tauri-app"
version = "0.5.1"
# The package/binary name stays `tauri-app`: the dev code-signing setup and
# macOS permission grants are tied to it (see scripts/dev-sign-runner.sh).
description = "Mouthpiece: local, private dictation for developers"
authors = ["Jake Finch"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
rdev = "0.5"
whisper-rs = { version = "0.14", features = ["metal"] }
arboard = "3"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
sherpa-onnx = "1.13.5"
signal-hook = "0.3"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-graphics = "0.25"
coreaudio-sys = { version = "0.2", default-features = false, features = ["core_audio"] }
macos-accessibility-client = "0.0.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSImage",
    "NSImageRep",
    "NSBitmapImageRep",
] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "block2"] }

