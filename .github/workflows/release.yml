name: Release

# Cutting a release is: bump the 3 version fields (see RELEASING.md), then
# `git tag vX.Y.Z && git push --tags`. Everything else happens here.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # Apple Silicon only, matching this app's own scope (see Cargo.toml) —
    # macos-latest runners have been arm64 since GH's macOS 14 image.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - run: bun install

      # Signs with the project's own certificate (self-made, not Apple's;
      # see RELEASING.md). Ad-hoc signatures change with every build, so
      # macOS dropped Accessibility and Microphone permission on each
      # update; with one certificate every release is the same app to it.
      # Gatekeeper's "can't verify" prompt is unchanged (that needs Apple's
      # notarization). Without the secret (a fork), builds stay ad-hoc.
      - name: Set up the release signing certificate
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_P12" ]; then
            echo "No MACOS_SIGNING_P12 secret: building ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          printf %s "$MACOS_SIGNING_P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" \
            -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The certificate isn't trusted by macOS, so it's picked by hash
          # (codesign accepts that; a name lookup only finds trusted ones).
          identity=$(security find-identity "$keychain" | awk '/Mouthpiece Release Signing/ { print $2; exit }')
          [ -n "$identity" ] || { echo "the signing certificate didn't import"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing with the release certificate ($identity)."

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Mouthpiece ${{ github.ref_name }}"
          releaseBody: "See the commit history for what changed."
          # Draft, not published automatically: CI handles the tedious,
          # error-prone part (build + sign), but a human still confirms the
          # build is good before it becomes the "latest" release every
          # installed copy auto-updates to. Publish it from the GitHub
          # Releases page once you've sanity-checked it.
          releaseDraft: true

      # A bundle that isn't signed as a whole (only the linker's signature
      # on the binary) is reported as "damaged" by macOS once downloaded.
      # `signingIdentity: "-"` in tauri.conf.json ad-hoc signs it; this
      # fails the release if that ever stops happening.
      - name: Verify the app's signature and microphone permission text
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          # Signed with the release certificate, not ad-hoc: macOS keeps
          # permissions across updates only if this holds.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign -d -r- "$app" 2>&1 | tee /dev/stderr | grep -q "certificate leaf" \
              || { echo "the app isn't signed with the release certificate"; exit 1; }
          fi
          codesign -dv "$app" 2>&1 | grep -q "Sealed Resources version" \
            || { echo "app bundle resources aren't sealed"; exit 1; }
          # Without this key macOS never asks for the microphone and the app
          # records silence (src-tauri/Info.plist).
          /usr/libexec/PlistBuddy -c "Print NSMicrophoneUsageDescription" "$app/Contents/Info.plist" \
            || { echo "Info.plist has no NSMicrophoneUsageDescription"; exit 1; }

      # A copy of the installer under a fixed name, so one link always
      # downloads the newest version:
      # https://github.com/JFinchy/mouthpiece/releases/latest/download/Mouthpiece.dmg
      # Dev-Whisper.dmg is the same file under the app's old name, for links
      # posted before the rename (GitHub forwards the old repo's URLs here).
      # Uploaded by release id because the release is still a draft here.
      - name: Attach Mouthpiece.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          for name in Mouthpiece.dmg Dev-Whisper.dmg; do
            gh api --method POST \
              -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${name}" \
              --input "$dmg"
          done
